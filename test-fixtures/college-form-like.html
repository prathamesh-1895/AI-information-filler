<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scholarship application – personal details</title>
    <script src="fixture-harness.js"></script>
    <style>
      .field { margin: 0.5rem 0; }
    </style>
  </head>
  <body>
    <!-- Phase 11 fixture for the college / scholarship / government-style family:
         parent names, split date of birth, category, an Aadhaar field (never filled)
         and an address block. -->
    <h1>Post-matric scholarship 2026–27</h1>
    <form id="scholarship">
      <fieldset>
        <legend>Personal details</legend>
        <div class="field">
          <label for="sname">Student's full name (as on marksheet)</label>
          <input id="sname" name="student_name" type="text" required data-fx="name" />
        </div>
        <div class="field">
          <label for="father">Father's name</label>
          <input id="father" name="father_name" type="text" required data-fx="father" />
        </div>
        <div class="field">
          <label for="mother">Mother's name</label>
          <input id="mother" name="mother_name" type="text" required data-fx="mother" />
        </div>
        <fieldset>
          <legend>Date of birth</legend>
          <label for="dob-d">Day</label>
          <select id="dob-d" name="dob_d" data-fx="dob-day">
            <option value="">DD</option>
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
            <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
            <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
            <option>21</option><option>22</option><option>23</option><option>24</option><option>25</option>
            <option>26</option><option>27</option><option>28</option><option>29</option><option>30</option>
            <option>31</option>
          </select>
          <label for="dob-m">Month</label>
          <select id="dob-m" name="dob_m" data-fx="dob-month">
            <option value="">MM</option>
            <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
            <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
            <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
            <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
          </select>
          <label for="dob-y">Year</label>
          <select id="dob-y" name="dob_y" data-fx="dob-year">
            <option value="">YYYY</option>
            <option>1998</option><option>1999</option><option>2000</option><option>2001</option>
            <option>2002</option><option>2003</option><option>2004</option><option>2005</option>
          </select>
        </fieldset>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category" data-fx="category">
            <option value="">Select</option>
            <option>General</option><option>OBC</option><option>SC</option><option>ST</option><option>EWS</option>
          </select>
        </div>
        <div class="field">
          <label for="aadhaar">Aadhaar number</label>
          <input id="aadhaar" name="aadhaar" type="text" inputmode="numeric" data-fx="aadhaar" />
        </div>
        <div class="field">
          <label for="income">Annual family income (₹)</label>
          <input id="income" name="income" type="number" data-fx="income" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Permanent address</legend>
        <div class="field">
          <label for="addr1">Address line 1</label>
          <input id="addr1" name="addr1" type="text" data-fx="addr1" />
        </div>
        <div class="field">
          <label for="village">City / Village</label>
          <input id="village" name="city" type="text" data-fx="city" />
        </div>
        <div class="field">
          <label for="district">District</label>
          <input id="district" name="district" type="text" data-fx="district" />
        </div>
        <div class="field">
          <label for="state">State</label>
          <select id="state" name="state" data-fx="state">
            <option value="">Select</option>
            <option>Maharashtra</option><option>Karnataka</option><option>Gujarat</option>
            <option>Tamil Nadu</option><option>Kerala</option><option>Goa</option>
          </select>
        </div>
        <div class="field">
          <label for="pin">PIN code</label>
          <input id="pin" name="pin" type="text" maxlength="6" data-fx="pin" />
        </div>
        <div class="field">
          <label for="mobile">Mobile number</label>
          <input id="mobile" name="mobile" type="tel" data-fx="mobile" />
        </div>
      </fieldset>

      <label><input type="checkbox" name="declare" data-fx="declare" /> I declare that the above information is true</label>
      <button type="submit">Final submit</button>
    </form>
  </body>
</html>
